[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "seed-vcs"
version = "0.3.0"
description = "Conditional version control for concurrent agents"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary,pool]>=3.2,<4"]
test = ["httpx>=0.27,<1"]

[project.scripts]
seed = "seed:main"
seed-server = "seed_server:main"
seed-benchmark = "benchmark:main"
seed-agent = "seed_agent:main"
seed-workflow-benchmark = "workflow_benchmark:main"

[tool.setuptools]
py-modules = ["seed", "seed_client", "seed_server", "seed_postgres", "benchmark", "seed_agent", "seed_workspace", "workflow_benchmark"]
